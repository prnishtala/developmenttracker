[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyloom"
version = "0.1.0"
description = "Serialized, personalized children's audio show — generation pipeline (M0 + M1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Pinned to compatible lower bounds; lock exact versions in a lockfile before prod.
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "typer>=0.12,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "anthropic>=0.34,<1",
  "httpx>=0.27,<1",
  "python-dateutil>=2.9,<3",
  # Ships a static ffmpeg so narrate/master run without a system ffmpeg (CI + dev).
  "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.5,<1",
]

[project.scripts]
storyloom = "storyloom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/storyloom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer's public API intentionally puts Option()/Argument() in parameter defaults.
ignore = ["B008"]
