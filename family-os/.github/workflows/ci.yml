name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build seed from calendars
        run: npm run seed:build
      - name: Verify schedule expansion
        run: npm run verify
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
